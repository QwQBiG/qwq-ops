name: Validate deployment tooling

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HELM_VERSION: v3.22.1

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python -m pip install -r requirements-dev.txt
      - name: Check scripts, configuration, and failure handling
        run: bash scripts/check.sh
      - uses: azure/setup-helm@v4.3.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Render pinned charts
        run: bash scripts/deploy.sh --render > /tmp/qwq-ops-rendered.yaml
      - name: Validate rendered integration contracts
        run: python tests/validate_rendered.py /tmp/qwq-ops-rendered.yaml

  api-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KIND_VERSION: v0.33.0
      KUBECTL_VERSION: v1.35.9
      NODE_IMAGE: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
      KIND_CLUSTER_NAME: qwq-api-${{ github.run_id }}-${{ github.run_attempt }}
      KIND_EXPERIMENTAL_PROVIDER: docker
    steps:
      - name: Configure isolated kubeconfig
        run: printf 'KUBECONFIG=%s\n' "$RUNNER_TEMP/qwq-api-kubeconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install manifest dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: azure/setup-helm@v4.3.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install verified kind and kubectl clients
        run: |
          install -d "$RUNNER_TEMP/bin"
          curl --fail --show-error --silent --location --retry 2 \
            "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64" \
            --output "$RUNNER_TEMP/kind-linux-amd64"
          curl --fail --show-error --silent --location --retry 2 \
            "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64.sha256sum" \
            --output "$RUNNER_TEMP/kind-linux-amd64.sha256sum"
          (cd "$RUNNER_TEMP" && sha256sum --check kind-linux-amd64.sha256sum)
          install -m 0755 "$RUNNER_TEMP/kind-linux-amd64" "$RUNNER_TEMP/bin/kind"
          curl --fail --show-error --silent --location --retry 2 \
            "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl" \
            --output "$RUNNER_TEMP/kubectl"
          curl --fail --show-error --silent --location --retry 2 \
            "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256" \
            --output "$RUNNER_TEMP/kubectl.sha256"
          printf '%s  %s\n' "$(cat "$RUNNER_TEMP/kubectl.sha256")" "$RUNNER_TEMP/kubectl" | sha256sum --check
          install -m 0755 "$RUNNER_TEMP/kubectl" "$RUNNER_TEMP/bin/kubectl"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Create temporary Kubernetes API
        run: |
          kind create cluster --name "$KIND_CLUSTER_NAME" --image "$NODE_IMAGE" \
            --kubeconfig "$KUBECONFIG" --wait 120s
          kubectl version
      - name: Render pinned charts and separate API resources
        run: |
          bash scripts/deploy.sh --render > "$RUNNER_TEMP/qwq-api-rendered.yaml"
          python tests/prepare_api_validation.py "$RUNNER_TEMP/qwq-api-rendered.yaml" "$RUNNER_TEMP/qwq-api-resources"
      - name: Establish CRDs and validate remaining resources
        run: |
          kubectl apply --server-side --field-manager=qwq-api-validation -f "$RUNNER_TEMP/qwq-api-resources/namespaces.yaml"
          kubectl apply --server-side --field-manager=qwq-api-validation -f "$RUNNER_TEMP/qwq-api-resources/crds.yaml"
          kubectl wait --for=condition=Established --timeout=120s -f "$RUNNER_TEMP/qwq-api-resources/crds.yaml"
          # Pod admission checks accounts even when the Pod itself is a dry run.
          if [[ -s "$RUNNER_TEMP/qwq-api-resources/serviceaccounts.yaml" ]]; then
            kubectl apply --server-side --field-manager=qwq-api-validation -f "$RUNNER_TEMP/qwq-api-resources/serviceaccounts.yaml"
          fi
          kubectl apply --server-side --dry-run=server --field-manager=qwq-api-validation -f "$RUNNER_TEMP/qwq-api-resources/resources.yaml"
          kubectl apply --server-side --dry-run=server --field-manager=qwq-api-validation -f examples/alerting/smoke-rule.yaml
      - name: Check monitoring reconciliation waits against the API
        run: |
          source scripts/lib/common.sh
          source scripts/lib/monitoring.sh
          python - "$RUNNER_TEMP/qwq-api-resources/resources.yaml" <<'PY' | kubectl apply -f -
          import sys
          import yaml
          kinds = {"VMSingle", "VMAgent", "VMAlert", "VMAlertmanager"}
          with open(sys.argv[1], encoding="utf-8") as stream:
              resources = [doc for doc in yaml.safe_load_all(stream) if doc and doc.get("kind") in kinds]
          assert len(resources) == len(kinds), "Expected the four monitoring resources"
          yaml.safe_dump_all(resources, sys.stdout)
          PY
          expect_monitoring_timeout() {
            local output
            if output=$(WAIT_TIMEOUT=1s monitoring_wait_ready "$1" 2>&1); then
              printf 'Unreconciled monitoring resource unexpectedly passed: %s\n' "$1" >&2
              exit 1
            fi
            printf '%s\n' "$output"
            [[ $output == *'timed out waiting for the condition'* ]] || {
              printf 'Monitoring wait failed before its timeout\n' >&2
              exit 1
            }
          }
          # Patch only status to exercise CLI predicates without running the Operator.
          while read -r resource; do
            generation=$(kube get "$resource" -n monitoring -o jsonpath='{.metadata.generation}')
            stale=$((generation - 1))
            kube patch "$resource" -n monitoring --subresource=status --type=merge \
              -p "{\"status\":{\"observedGeneration\":$stale,\"updateStatus\":\"operational\"}}"
            expect_monitoring_timeout "$resource"
            kube patch "$resource" -n monitoring --subresource=status --type=merge \
              -p "{\"status\":{\"observedGeneration\":$generation,\"updateStatus\":\"failed\"}}"
            expect_monitoring_timeout "$resource"
            kube patch "$resource" -n monitoring --subresource=status --type=merge \
              -p "{\"status\":{\"observedGeneration\":$generation,\"updateStatus\":\"operational\"}}"
            WAIT_TIMEOUT=10s monitoring_wait_ready "$resource"
            [[ $(monitoring_state "$resource") == "$generation|$generation|operational" ]]
          done < <(monitoring_resources)
      - name: Check analyzer configuration waits against the API
        run: |
          source scripts/lib/common.sh
          source scripts/lib/k8sgpt.sh
          python - "$RUNNER_TEMP/qwq-api-resources/resources.yaml" <<'PY' | kubectl apply -f -
          import sys
          import yaml
          resources = yaml.safe_load_all(open(sys.argv[1], encoding="utf-8"))
          integration = next(doc for doc in resources if doc and doc.get("kind") == "K8sGPT")
          yaml.safe_dump(integration, sys.stdout)
          PY
          expected=$(k8sgpt_config)
          mapfile -t target <<< "$expected"
          # Exercise CLI configuration checks without an Operator or workload Pods.
          kubectl apply -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: k8sgpt
            namespace: k8sgpt
          spec:
            replicas: 0
            selector:
              matchLabels:
                app: configuration-check
            template:
              metadata:
                labels:
                  app: configuration-check
              spec:
                containers:
                  - name: k8sgpt
                    image: registry.invalid/k8sgpt:old
          YAML
          kubectl set env deployment/k8sgpt -n k8sgpt \
            "K8SGPT_MODEL=${target[0]}" "K8SGPT_BACKEND=${target[1]}" "K8SGPT_BASEURL=${target[2]}"
          expect_timeout() {
            local output
            if output=$(WAIT_TIMEOUT=1s k8sgpt_wait_config "$expected" 2>&1); then
              printf 'An outdated or missing configuration unexpectedly passed\n' >&2
              exit 1
            fi
            printf '%s\n' "$output"
            [[ $output == *'timed out waiting for the condition'* ]] || {
              printf 'Configuration wait failed before its timeout\n' >&2
              exit 1
            }
          }
          expect_timeout
          kubectl set image deployment/k8sgpt -n k8sgpt "k8sgpt=${target[3]}"
          WAIT_TIMEOUT=10s k8sgpt_wait_config "$expected"
          [[ $(k8sgpt_template_config) == "$expected" ]]
          kubectl set env deployment/k8sgpt -n k8sgpt K8SGPT_MODEL-
          expect_timeout
      - name: Delete temporary cluster
        if: always()
        run: |
          if [[ -x "$RUNNER_TEMP/bin/kind" ]]; then
            "$RUNNER_TEMP/bin/kind" delete cluster --name "$KIND_CLUSTER_NAME" --kubeconfig "$KUBECONFIG"
          fi
