name: Validate deployment tooling

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python -m pip install -r requirements-dev.txt
      - name: Check scripts, configuration, and failure handling
        run: bash scripts/check.sh
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Render pinned charts
        run: bash scripts/deploy.sh --render > /tmp/qwq-ops-rendered.yaml
      - name: Validate rendered integration contracts
        run: python tests/validate_rendered.py /tmp/qwq-ops-rendered.yaml
